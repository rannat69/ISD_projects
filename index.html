<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HKUST MPhil TIE - Weekly Progress Tracker (Demo)</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body>
    <div id="app">
      <aside class="sidebar" aria-label="Sidebar Navigation">
        <div class="brand">
          <div class="logo" aria-hidden="true">TIE</div>
          <div class="brand-text">HKUST MPhil TIE</div>
        </div>
        <nav class="nav">
          <button
            class="nav-link active"
            data-page="dashboard"
            aria-current="page"
          >
            Dashboard
          </button>
          <button class="nav-link" data-page="students" id="studentsButton">
            Students
          </button>
          <button class="nav-link" data-page="courses" id="coursesButton">
            Courses
          </button>
          <button class="nav-link" data-page="teams" id="teamsButton">
            Teams
          </button>
          <button class="nav-link" data-page="reports" id="reportsButton">
            Reports
          </button>
          <button class="nav-link" data-page="settings" id="settingsButton">
            Settings
          </button>
          <button class="nav-link" id="logoutButton">Log out</button>
        </nav>
        <footer class="sidebar-footer">
          <small>Demo • LocalStorage</small>
        </footer>
      </aside>
      <main id="mainContent" tabindex="-1" aria-live="polite"></main>
    </div>
    <div id="toastContainer" aria-live="assertive" aria-atomic="true"></div>
    <script src="./constant.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
